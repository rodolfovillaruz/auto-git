name: Release

# Triggered by `make tag` / `make publish`, which push tags like `v1.0.1`.
on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/create-gh-release-action@v1
        with:
          allow-missing-changelog: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Cross-platform binaries: cargo-binstall resolves these directly from
  # GitHub Releases using [package.metadata.binstall] in Cargo.toml.
  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: wac
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # Debian/Ubuntu package (`dpkg -i wac_*.deb`), attached to the release.
  deb:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deb --locked
      - run: cargo deb
      - run: gh release upload "${GITHUB_REF_NAME}" target/debian/*.deb --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Pushes an updated formula to github.com/rodolfovillaruz/homebrew-tap.
  # Requires: that repo to exist, and a HOMEBREW_TAP_TOKEN secret (classic
  # PAT with `repo` scope) set on THIS repo. See README for setup.
  homebrew:
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - uses: Justintime50/homebrew-releaser@v3
        with:
          homebrew_owner: rodolfovillaruz
          homebrew_tap: homebrew-tap
          formula_folder: Formula
          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          commit_owner: rodolfovillaruz
          commit_email: rodolfojr.villaruz@gmail.com
          install: 'bin.install "wac"'
          test: 'system "#{bin}/wac", "--help"'
          target_darwin_amd64: true
          target_darwin_arm64: true
          target_linux_amd64: true
          target_linux_arm64: true
          update_readme_table: false

  # Submits a PR to microsoft/winget-pkgs bumping the version.
  # Requires: the package already registered in winget-pkgs (first
  # submission must be done manually, see README), and a WINGET_TOKEN
  # secret (classic PAT with `public_repo` scope) set on THIS repo.
  winget:
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: RodolfoVillaruz.WatchAndCommit
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
